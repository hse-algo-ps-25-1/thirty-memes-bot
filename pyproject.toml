[project]
name = "thirty-memes-bot"
version = "0.1.0"
description = "Telegram-бот для выполнения задания по программированию"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic-settings>=2.11",
    "pymorphy3>=2.0.6",
    "pymorphy3-dicts-ru>=2.4.417150.4580142",
    "python-telegram-bot>=22.5",
]

[project.scripts]
thirty-memes-bot = "thirty_memes_bot.__main__:main"
local-chat = "thirty_memes_bot.local_chat:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thirty_memes_bot"]
